:root{color-scheme:light;background:#e8eef1;color:#172d3e}
*{box-sizing:border-box}
body{margin:0}
.leaflet{max-width:1160px;margin:0 auto;padding:24px 16px;display:grid;
  grid-template-columns:repeat(297,minmax(0,1fr));row-gap:16px}
.sheet{display:contents}
.panel{display:block;min-width:0;background:#fff;margin:0}
.panel svg{display:block;width:100%;height:auto;overflow:hidden}
.panel svg a{cursor:pointer}
.panel svg a:hover text,.panel svg a:focus-visible text{text-decoration:underline}
.panel svg a:focus-visible{outline:2px solid #174b8f}
.flap{grid-row:1;grid-column:1/span 97}
.back{grid-row:1;grid-column:98/span 100}
.cover{grid-row:1;grid-column:198/span 100}
.inside-one{grid-row:2;grid-column:1/span 100}
.inside-two{grid-row:2;grid-column:101/span 100}
.inside-three{grid-row:2;grid-column:201/span 97}
.definitions{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
@media screen and (max-width:850px){
  .leaflet{display:flex;flex-direction:column;gap:12px;max-width:475px;padding:12px}
  .panel{box-shadow:0 1px 5px #142a3d26}
  .cover{order:0}
  .flap{order:1}
  .inside-one{order:2}
  .inside-two{order:3}
  .inside-three{order:4}
  .back{order:5}
}
@page{size:A4 landscape;margin:0}
@media print{
  :root{background:white}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .leaflet{display:block;padding:0;margin:0;max-width:none;width:297mm}
  .sheet{display:grid;width:297mm;height:210mm;break-inside:avoid;
    grid-template-columns:repeat(297,minmax(0,1fr));grid-template-rows:210mm}
  .outside{break-after:page}
  .panel{grid-row:1}
  .panel svg{height:210mm}
}
</style>
